<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>BUNKER 402 - Console Centrale</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #1a1a1a; color: #e0e0e0; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 10px; }
        .lobby-code { font-size: 2em; color: #f1c40f; background: #000; padding: 10px; border: 2px solid #444; display: inline-block; margin: 10px; }
        
        /* Jauge d'Oxygène */
        #oxy-bar { height: 25px; background: #333; border-radius: 15px; border: 2px solid #555; overflow: hidden; width: 80%; margin: 10px auto; }
        #oxy-level { height: 100%; background: #3498db; width: 100%; transition: 1s; }
        .critical { animation: blink 1s infinite; background: #e74c3c !important; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Mise en page des Plateaux */
        .main-layout { display: flex; justify-content: space-around; align-items: flex-start; }
        .board { background: #2d2d2d; padding: 15px; border-radius: 10px; width: 30%; border: 1px solid #555; }
        .slot { width: 40px; height: 60px; border: 2px dashed #555; display: inline-block; margin: 5px; border-radius: 4px; }
        .filled-s { background: #3498db; border-style: solid; box-shadow: 0 0 10px #3498db; }
        .filled-c { background: #e74c3c; border-style: solid; box-shadow: 0 0 10px #e74c3c; }
        .filled-f { background: #7f8c8d; border-style: solid; box-shadow: 0 0 10px #7f8c8d; }

        /* Conseil et Fin de partie */
        .gov-box { background: #333; border: 2px solid #f1c40f; padding: 10px; margin-bottom: 10px; border-radius: 10px; display: none; }
        #end-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        #log { background: #000; color: #00ff00; padding: 10px; height: 80px; overflow-y: auto; width: 90%; margin: 10px auto; text-align: left; font-size: 0.8em; }

        /* Animations Lobby */
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        #player-list div {
            background: #333; 
            color: #2ecc71; 
            padding: 10px 20px; 
            border: 1px solid #2ecc71; 
            border-radius: 5px; 
            font-weight: bold; 
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.2); 
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* État par défaut des étiquettes */
        .player-tag {
            background: #333;
            color: #2ecc71;
            padding: 5px 15px;
            border: 1px solid #2ecc71;
            border-radius: 5px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 120px; /* pour que les tags aient tous une taille similaire */
            line-height: 1.1;  /* Pour que les deux lignes soient proches */
            transition: all 0.3s ease;
        }
        
        /* Coloration des étiquettes */
        .voted-oui { background: #2ecc71 !important; color: #000 !important; border-color: #FFF !important; }
        .voted-non { background: #e74c3c !important; color: #fff !important; border-color: #FFF !important; }

        .p-name {
            font-size: 1.1em;
            margin-bottom: 2px;
        }
        .p-job {
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="end-screen">
        <h1 id="victory-title" style="font-size: 4em; margin-bottom:10px;"></h1>
        <h2 id="victory-reason" style="color: #f1c40f; margin-bottom:30px;"></h2>
        <button onclick="location.reload()" style="padding: 20px; background: #2ecc71; border: none; cursor: pointer; font-weight: bold; border-radius:10px;">REINITIALISER LE BUNKER</button>
    </div>

    <h1>BUNKER 402 - SYSTÈME CENTRAL</h1>

    <div id="setup-zone">
        <div id="server-creation" style="margin: 20px 0;">
            <input type="text" id="custom-id" placeholder="NOM DE LA PARTIE (ex: BUNKER-402)" 
                   style="padding: 15px; width: 300px; background: #000; color: #f1c40f; border: 2px solid #444; font-family: 'Courier New';">
            <button onclick="startServer()" style="padding: 15px 25px; background: #444; color: white; cursor: pointer; border: none; font-weight: bold;">CRÉER LE SERVEUR</button>
        </div>
    
        <div id="lobby-active" style="display: none;">
            <div class="lobby-code" id="display-id"></div>
            <p>Joueurs connectés : <span id="count">0</span> / 10</p>
            <div id="player-list" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px auto; max-width: 600px;"></div>
            <button onclick="initGame()" id="start-btn" disabled style="padding:15px 30px; background:#2ecc71; cursor:pointer; font-weight:bold; border-radius:10px; border:none;">INITIALISER LA PARTIE</button>
        </div>
    </div>

    <div id="game-zone" style="display:none">
        <!-- Barre d'Oxygène -->
        <div id="oxy-bar"><div id="oxy-level"></div></div>
    
        <!-- Zone du Conseil -->
        <div id="gov-display" class="gov-box">
            <h3 style="margin:0; color:#f1c40f;">CONSEIL ACTUEL</h3>
            <p style="font-size:1.5em; margin:5px;"><span id="g-name" style="color:#f1c40f">?</span> & <span id="s-name" style="color:#3498db">?</span></p>
            <div id="vote-summary">DÉSIGNATION DU CONSEIL : Le Gardien choisit sa Sentinelle...</div>
            <div id="vote-details" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px;"></div>
        </div>
    
        <!-- Plateaux de décrets (Largeur complète) -->
        <div class="main-layout" style="margin-bottom: 30px;">
            <div class="board"><h4>PROTOCOLES DE SURVIE</h4><div id="slots-s"></div></div>
            <div class="board"><h4>ORDRE DU JOUR</h4><div id="slots-f"></div></div>
            <div class="board"><h4>DIRECTIVES DE CRISE</h4><div id="slots-c"></div></div>
        </div>
    
        <!-- LISTE DES JOUEURS (Sous les plateaux) -->
        <div style="border-top: 1px solid #444; padding-top: 20px;">
            <h4 style="color: #7f8c8d; margin-bottom: 15px; letter-spacing: 2px;">PERSONNEL DU BUNKER</h4>
            <div id="active-player-list" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 1000px; margin: 0 auto;"></div>
        </div>
    
        <div id="log"></div>
    </div>

    <script>
        // 1. On déclare peer sans l'initialiser
        let peer = null; 
        
        let players = [], deck = [], curG = 0, curSIdx = -1;
        let votes = { oui: 0, non: 0, total: 0, list: [] };
        let state = { survie: 0, crise: 0, oxy: 3, gameOver: false, suffrage: "Aucun" };
        let isProcessingAction = false;
        let lastSentinelle = null;
        let lastGardien = null;
        
        // 2. La fonction de démarrage (à mettre AVANT tes autres fonctions)
        function startServer() {
            const customId = document.getElementById('custom-id').value.trim();
            if (!customId) return alert("Veuillez saisir un code !");
        
            // Initialisation du Peer avec ton code
            peer = new Peer(customId, { 
                config: {'iceServers': [{ url: 'stun:stun.l.google.com:19302' }]} 
            });
        
            peer.on('open', id => {
                    // On bascule l'affichage
                    document.getElementById('server-creation').style.display = 'none';
                    document.getElementById('lobby-active').style.display = 'block';
                    document.getElementById('display-id').innerText = "CODE CONSOLE : " + id;
                });
        
            peer.on('error', err => {
                    if (err.type === 'unavailable-id') {
                        alert("Ce code est déjà utilisé. Essayez une autre combinaison (ajoutez des chiffres) !");
                    } else {
                        alert("Erreur fatale : " + err.type);
                        location.reload(); // On reboot en cas d'erreur
                    }
                });
        
            // Écouteur de connexion déplacé ici
            peer.on('connection', conn => {
                // C'est ici que tu appelles ta gestion de données habituelle
                setupConnection(conn);
            });
        }
        
        // 3. On enveloppe tes anciens écouteurs dans cette fonction
        function setupConnection(conn) {
            conn.on('data', data => {
                if (state.gameOver) return;

                // Gestion de l'entrée des joueurs
                if (data.type === 'JOIN') {

                    // Vérification de la capacité MAX => 10 joueurs
                    if (players.length >= 10) {
                        conn.send({ type: 'ERROR_BUNKER_FULL' });
                        return; // On stoppe l'entrée
                    }
                    
                    // Sécurité supplémentaire sur la longueur du nom
                    if (data.name.length > 12) {
                        conn.send({ type: 'CLEAN_UI' }); // Ou un message d'erreur
                        return;
                    }
                    
                    // Vérifier si le nom existe déjà (on ignore la casse : dylan = DYLAN)
                    const nameExists = players.some(p => p.name.toLowerCase() === data.name.toLowerCase());

                    if (nameExists) {
                        // On envoie un message d'erreur spécifique au téléphone
                        conn.send({ type: 'ERROR_NAME_TAKEN' });
                        return; // On arrête la fonction ici
                    }
                    
                    // Si le nom est libre, on continue normalement
                    players.push({ name: data.name, conn: conn });
                    
                    // On met à jour les deux conteneurs (Lobby et Zone de jeu)
                    const lobbyList = document.getElementById('player-list');
                    const activeList = document.getElementById('active-player-list');
                    // Création étiquette
                    const createTag = () => {
                        const nameTag = document.createElement('div');
                        nameTag.className = 'player-tag';
                        nameTag.id = `tag-${data.name.toLowerCase()}`;
                        // Structure : NOM en haut, METIER (vide pour l'instant) en bas
                        nameTag.innerHTML = `<div class="p-name">${data.name.toUpperCase()}</div><div class="p-job" style="font-size: 0.6em; opacity: 0.8; font-weight: normal;"></div>`;
                        return nameTag;
                    };
                    
                    lobbyList.appendChild(createTag()); // Pour le lobby
                    activeList.appendChild(createTag()); // Pour la partie en cours (caché pour l'instant)
                
                    document.getElementById('count').innerText = players.length;
                    if(players.length >= 5) document.getElementById('start-btn').disabled = false;
                    conn.send({ type: 'CONNECTED' });
                }

                // Le Gardien a choisi sa Sentinelle
                if (data.type === 'SENTINELLE_CHOISIE') {
                    resetTagColors(); // On efface les votes du tour précédent
                    
                    // On remet l'étoile et la bordure sur le Gardien
                    const gTags = document.querySelectorAll(`[id="tag-${players[curG].name.toLowerCase()}"]`);
                    gTags.forEach(tag => {
                        const nameDiv = tag.querySelector('.p-name');
                        if (nameDiv) nameDiv.innerHTML = `⭐ ${players[curG].name.toUpperCase()}`;
                        tag.style.borderColor = "#f1c40f";
                        tag.style.borderWidth = "2px";
                    });
                    
                    // Stockage de l'index de la Sentinelle
                    curSIdx = players.findIndex(p => p.name === data.sentinelleName);
                    // Lancement de l'affichage du conseil
                    showGov(data.gardienName, data.sentinelleName);
                }

                // Dès qu'un joueur à voté
                if (data.type === 'VOTE_DONE') {
                    // On enregistre le vote avec le nom du joueur
                    votes[data.choice.toLowerCase()]++; 
                    // Augmente le compteur de votes
                    votes.total++;
                    votes.list.push({ name: data.playerName, choice: data.choice }); // On stocke l'objet vote
                
                    // Si tout le monde a voté
                    if(votes.total === players.length) resolveVote();
                }
                
                // Le Gardien vient de défausser sa carte
                if (data.type === 'DISCARD_DONE') {
                    //Mise a jour de l'affichage principal
                    document.getElementById('vote-summary').innerText = "DÉCRET REÇU : La Sentinelle choisit le décret final";
                    document.getElementById('vote-summary').style.color = "#f1c40f";
                
                    // On prévient TOUT LE MONDE que c'est au tour de la Sentinelle
                    players.forEach(p => {
                        p.conn.send({ type: 'WAIT_LEGISLATION', step: 'SENTINELLE' });
                    });

                    // Envoi des cartes restantes à la Sentinelle
                    players[curSIdx].conn.send({ type: 'SENTINELLE_PICK', cards: data.remaining });
                }

                // La Sentinelle a choisi le décret à appliquer
                if (data.type === 'FINAL_CHOICE' && !isProcessingAction) { 
                    //Empêche de poser 2 cartes d'un coup
                    isProcessingAction = true;
                    // Appel fonction qui pose la carte sur le plateau
                    applyDecret(data.card);
                }
            });
        };

        // Initialisation de la partie
        function initGame() {
            // Création du deck
            deck = [...Array(10).fill('S'), ...Array(15).fill('C'), ...Array(4).fill('F')].sort(() => Math.random() - 0.5);
            // Création des rôles
            const roles = (players.length >= 7 ? ['S','S','S','S','I','I','A'] : ['S','S','S','I','A']).sort(() => Math.random() - 0.5);
            // Création des métiers
            const metiers = ['Shérif', 'Docteur', 'Technicien', 'Journaliste', 'Militaire', 'Psychologue', 'Contrebandier', 'Fossoyeur', 'Éclaireur', 'Vigile'].sort(() => Math.random() - 0.5);

            // Attribution des rôles et métiers
            players.forEach((p, i) => {
                p.role = roles[i] || 'S';
                p.metier = metiers[i];
                p.conn.send({ type: 'INIT', role: p.role, metier: p.metier, all: players.map(pl => pl.name) });
            });
            
            // MISE À JOUR VISUELLE UNIQUE DES ÉTIQUETTES
            updateTagsWithJobs();

            // Affichage de la zone de jeu
            document.getElementById('setup-zone').style.display = 'none';
            document.getElementById('game-zone').style.display = 'block';
            nextTurn();
        }

        function updateTagsWithJobs() {
            players.forEach(p => {
                // On cible TOUTES les étiquettes (Lobby + Jeu) ayant cet ID
                const tags = document.querySelectorAll(`[id="tag-${p.name.toLowerCase()}"]`);
                tags.forEach(tag => {
                    // On injecte le nom et le métier proprement
                    tag.innerHTML = `
                        <div class="p-name">${p.name.toUpperCase()}</div>
                        <div class="p-job" style="font-size: 0.65em; opacity: 0.8; font-weight: normal; margin-top: 2px;">
                            ${p.metier}
                        </div>
                    `;
                });
            });
        }
        
        // Gestion couleur des étiquettes de nom
        function resetTagColors() {
            players.forEach(p => {
                const tags = document.querySelectorAll(`[id="tag-${p.name.toLowerCase()}"]`);
                tags.forEach(tag => {
                    // 1. On remet la classe de base (enlève le vert/rouge des votes)
                    tag.className = 'player-tag'; 
                    
                    // 2. On retire les bordures de rôles (dorée/bleue)
                    tag.style.borderColor = "";   
                    tag.style.borderWidth = "1px";
                    
                    // 3. IMPORTANT : On réinitialise le contenu HTML pour supprimer l'étoile
                    tag.innerHTML = `
                        <div class="p-name">${p.name.toUpperCase()}</div>
                        <div class="p-job" style="font-size: 0.65em; opacity: 0.8; font-weight: normal; margin-top: 2px;">
                            ${p.metier}
                        </div>
                    `;
                });
            });
        }
        
        // Gestion de la barre d'oxygène
        function render() {
            const oxyBar = document.getElementById('oxy-level');
            oxyBar.style.width = (state.oxy/3*100) + "%";
            oxyBar.className = (state.oxy <= 1) ? "critical" : "";
            
            let s = ""; for(let i=0; i<5; i++) s += `<div class="slot ${i < state.survie ? 'filled-s' : ''}"></div>`;
            document.getElementById('slots-s').innerHTML = s;
            
            let c = ""; for(let i=0; i<6; i++) c += `<div class="slot ${i < state.crise ? 'filled-c' : ''}"></div>`;
            document.getElementById('slots-c').innerHTML = c;
            
            let f = `<div class="slot ${state.suffrage !== "Aucun" ? 'filled-f' : ''}"></div>`;
            document.getElementById('slots-f').innerHTML = f;
        }

        // Envoi des informations de la barre d'oxygène aux joueurs
        function syncTerminals() {
            players.forEach(p => p.conn.send({ type: 'SYNC_STATE', state: state }));
        }

// Affichage du Gouvernement proposé
        function showGov(g, s) {
            // Sélection de toutes les étiquettes de la sentinelle (Lobby + Jeu)
            const sTags = document.querySelectorAll(`[id="tag-${s.toLowerCase()}"]`);
            sTags.forEach(tag => {
                tag.style.borderColor = "#3498db"; // Contour bleu pour la sentinelle
                tag.style.borderWidth = "2px";
            });
            
            // On affiche le bloc du conseil
            document.getElementById('gov-display').style.display = 'block';
            
            // On met à jour les noms des deux membres
            document.getElementById('g-name').innerText = g; 
            document.getElementById('s-name').innerText = s;
            
            // Changement du message principal
            document.getElementById('vote-summary').innerText = "SCRUTIN EN COURS : Approuvez-vous ce conseil ?";
            document.getElementById('vote-summary').style.color = "#f1c40f"; 
        
            // On lance le signal de vote aux téléphones
            players.forEach(p => p.conn.send({ type: 'VOTE_START', g: g, s: s }));
        }

        // Résolution du vote
        function resolveVote() {
            votes.list.forEach(v => {
                const tags = document.querySelectorAll(`[id="tag-${v.name.toLowerCase()}"]`);
                tags.forEach(t => {
                    t.classList.add(v.choice === 'OUI' ? 'voted-oui' : 'voted-non');
                });
            });
        
            if(votes.oui > votes.non) {
                document.getElementById('vote-summary').innerText = "VOTE ACCEPTÉ";
                document.getElementById('vote-summary').style.color = "#2ecc71";
                players.forEach(p => p.conn.send({ type: 'WAIT_LEGISLATION', step: 'GARDIEN' }));
        
                if(state.crise >= 3 && players[curSIdx].role === 'A') {
                    triggerWin("INFECTES", "L'Alpha a été élu Sentinelle.");
                    return;
                }
                state.oxy = 3;
                players[curG].conn.send({ type: 'GARDIEN_PICK', cards: [deck.pop(), deck.pop(), deck.pop()] });
            } else {
                document.getElementById('vote-summary').innerText = "VOTE REJETÉ";
                document.getElementById('vote-summary').style.color = "#e74c3c";
        
                // LE VOTE A ÉCHOUÉ : On nettoie tout (bordures et étoiles) avant le tour suivant
                resetTagColors(); 
                
                state.oxy--;
                if(state.oxy <= 0) applyForced();
                else { 
                    curG = (curG + 1) % players.length; 
                    setTimeout(nextTurn, 1500); 
                }
            }
            syncTerminals(); render();
        }

        // Protocole de Sécurité
        function applyForced() {
            // Tirage de carte à appliqué, si Suffrage => tirer une nouvelle carte
            let card = deck.pop(); while(card === 'F') card = deck.pop();
            applyDecret(card); state.oxy = 3;
        }
        
        // Application du décret choisi par la Sentinelle
        function applyDecret(type) {
            if(type === 'S') state.survie++;                // Ajout décret bleu
            else if(type === 'C') state.crise++;            // Ajout décret rouge
            else if(type === 'F') state.suffrage = "Actif"; // Ajout décret gris
        
            // --- CRITIQUE : ON MET À JOUR L'ÉCRAN TOUT DE SUITE ---
            render(); 
            syncTerminals(); 
        
            // Vérification conditions de victoire
            if(state.survie >= 5) {
                triggerWin("SURVIVANTS", "Protocoles rétablis.");
            } 
            else if(state.crise >= 6) {
                triggerWin("INFECTES", "Infection totale.");
            } 
            else {
                // On mémorise le gouvernement qui vient de finir
                lastSentinelle = players[curSIdx].name;
                lastGardien = players[curG].name;
                
                // Nouveau Gardien
                curG = (curG + 1) % players.length;
                
                // On laisse un petit délai (1s) pour que les joueurs voient le plateau se remplir 
                // avant de passer au tour suivant
                setTimeout(() => { 
                    isProcessingAction = false; 
                    nextTurn(); 
                }, 1000);
            }
        }

        // Nouveau tour
        function nextTurn() {
            // --- NETTOYAGE SYSTÉMATIQUE AVANT DE COMMENCER ---
            resetTagColors(); 

            // On désigne le NOUVEAU gardien uniquement après le reset
            const tags = document.querySelectorAll(`[id="tag-${players[curG].name.toLowerCase()}"]`);
            tags.forEach(tag => {
                const nameDiv = tag.querySelector('.p-name');
                if (nameDiv) nameDiv.innerHTML = `⭐ ${players[curG].name.toUpperCase()}`;
                tag.style.borderColor = "#f1c40f"; 
                tag.style.borderWidth = "2px";
            });
            
            votes = { oui: 0, non: 0, total: 0, list: [] };
            document.getElementById('vote-details').innerHTML = "";

            document.getElementById('gov-display').style.display = 'block';
            document.getElementById('vote-summary').innerText = "DÉSIGNATION DU CONSEIL : Le Gardien choisit sa Sentinelle...";
            document.getElementById('vote-summary').style.color = "#3498db";
            
            // Mise à jour visuelle du conseil (Couleurs inversées selon ta demande)
            document.getElementById('g-name').innerText = players[curG].name;
            document.getElementById('s-name').innerText = "?";

            players.forEach(p => p.conn.send({ type: 'CLEAN_UI' }));
            players.forEach((p, index) => {
                if(index !== curG) p.conn.send({ type: 'WAIT_SENTINELLE', gardienName: players[curG].name });
            });

            let eligiblePlayers = players.map(p => p.name).filter(name => {
                if (name === players[curG].name) return false;
                if (name === lastSentinelle) return false;
                if (players.length > 5 && name === lastGardien) return false;
                return true;
            });
            
            players[curG].conn.send({ type: 'YOUR_TURN', eligible: eligiblePlayers });
            syncTerminals(); render();
        }

        // Fin de jeu
        function triggerWin(team, reason) {
            // Affichage écran de fin index
            state.gameOver = true;
            document.getElementById('end-screen').style.display = "flex";
            document.getElementById('victory-title').innerText = "VICTOIRE : " + team;
            document.getElementById('victory-reason').innerText = reason;
            // Déclenche l'écran de fin pour les joueurs
            players.forEach(p => p.conn.send({ type: 'END_GAME', team: team, reason: reason }));
        }

    </script>
</body>
</html>
