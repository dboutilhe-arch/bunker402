<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>BUNKER 402 - Console Centrale</title>
    <link rel="stylesheet" href="css/central.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <button onclick="globalReset()" id="admin-reset">FORCE RESET</button>
    <h1>BUNKER 402 - SYSTÈME CENTRAL</h1>

    <div id="setup-zone">
        <div id="server-creation">
            <input type="text" id="custom-id" placeholder="NOM DE LA PARTIE (ex: BUNKER-402)">
            <button onclick="startServer()">CRÉER LE SERVEUR</button>
        </div>
        <div id="lobby-active" style="display: none;">
            <p>CODE CONSOLE :</p>
            <div class="lobby-code" id="display-id"></div>
            <p>Joueurs connectés : <span id="count">0</span> / 100</p>
            <div id="player-list"></div>
            <button onclick="initGame()" id="start-btn" disabled>INITIALISER LA PARTIE</button>
        </div>
    </div>

    <div id="game-zone" style="display:none">
        <div id="oxy-bar"><div id="oxy-level"></div></div>
        <div id="game-info-row" style="display: none;">
            <div class="info-box" style="border-color: #e74c3c;">
                <h4>DERNIER CONSEIL</h4>
                <div id="last-council-display">Aucun</div>
            </div>
            <div class="info-box" style="border-color: #f1c40f;">
                <h4>CONSEIL ACTUEL</h4>
                <p><span id="g-name">?</span> & <span id="s-name">?</span></p>
                <div id="vote-summary">DÉSIGNATION DU CONSEIL...</div>
            </div>
            <div class="info-box" style="border-color: #2ecc71;">
                <h4>COMPOSITION</h4>
                <div id="composition-display"></div>
            </div>
        </div>
        <div class="main-layout">
            <div class="board"><h4>PROTOCOLES DE SURVIE</h4><div id="slots-s"></div></div>
            <div class="board"><h4>ORDRE DU JOUR</h4><div id="slots-f"></div></div>
            <div class="board"><h4>DIRECTIVES DE CRISE</h4><div id="slots-c"></div></div>
        </div>
        <div id="active-player-list"></div>
        <div id="log"></div>
    </div>

    <div id="end-screen">
        <h1 id="victory-title"></h1>
        <h2 id="victory-reason"></h2>
        <div id="role-reveal-zone"></div>
        <button onclick="globalReset()">REINITIALISER LE SYSTÈME</button>
    </div>

    <script type="module">
        import { startServer } from './js/network/peer-manager.js';
        import { initGame } from './js/game/engine.js';
        import { globalReset } from './js/ui/renderer.js';
        window.startServer = startServer;
        window.initGame = initGame;
        window.globalReset = globalReset;
    </script>
</body>
</html>
