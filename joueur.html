<!-- joueur.html -->

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUNKER 402 - Terminal</title>
    <link rel="stylesheet" href="css/mobile.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="status-bar">CONNEXION EN COURS...</div>

    <!-- ÉCRAN DE CONNEXION -->
    <div id="login-screen" class="screen">
        <h1 class="glitch">TERMINAL MOBILE</h1>
        <input type="text" id="server-id" placeholder="CODE DU BUNKER">
        <input type="text" id="player-name" placeholder="VOTRE NOM">
        <button onclick="connectToServer()" id="join-btn">INTÉGRER LE BUNKER</button>
    </div>

    <!-- LOBBY D'ATTENTE -->
    <div id="lobby-screen" class="screen" style="display:none">
        <p>IDENTITÉ EN COURS DE VÉRIFICATION...</p>
        <div class="loader"></div>
        <p id="waiting-msg">En attente du Superviseur...</p>
    </div>

    <!-- ZONE DE JEU PRINCIPALE -->
    <div id="game-zone" class="screen" style="display:none">
        <div id="role-card">
            <div id="p-metier">Métier : ---</div>
            <div id="p-role">Rôle : ---</div>
        </div>

        <div id="action-area">
            <h2 id="phase-title">INITIALISATION...</h2>
            <div id="controls"></div>
        </div>
        
        <!-- Zone spécifique pour les résultats de scan -->
        <div id="feedback-area"></div>
    </div>

    <!-- ÉCRAN DE FIN -->
    <div id="end-screen" class="screen" style="display:none">
        <h1 id="end-result">---</h1>
        <p id="end-reason"></p>
        <button onclick="location.reload()">RETOUR LOBBY</button>
    </div>

    <script type="module">
        let peer = null;
        let conn = null;
        let myName = "";
        let myRole = "";
        let myMetier = "";
        let isPowerUsed = false;

        window.connectToServer = () => {
            const serverId = document.getElementById('server-id').value.trim();
            myName = document.getElementById('player-name').value.trim();

            if (!serverId || !myName) return alert("Infos manquantes !");

            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(serverId);
                setupConnection();
            });
        };

        function setupConnection() {
            conn.on('open', () => {
                conn.send({ type: 'JOIN', name: myName });
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('lobby-screen').style.display = 'block';
                document.getElementById('status-bar').innerText = "VÉRIFIÉ : " + myName.toUpperCase();
            });

            conn.on('data', (data) => {
                switch(data.type) {
                    case 'INIT':
                        myRole = data.role;
                        myMetier = data.metier;
                        isPowerUsed = data.powerUsed || false;
                        startUI(data);
                        break;
                    
                    case 'YOUR_TURN':
                        showDesignation(data.eligible);
                        break;

                    case 'VOTE_START':
                        showVote(data.g, data.s);
                        break;

                    case 'GARDIEN_PICK':
                        showLegislative(data.cards, 3);
                        break;

                    case 'SENTINELLE_PICK':
                        showLegislative(data.cards, 2);
                        break;

                    case 'BLOOD_TEST_RESULT':
                        showScanResult(data.target, data.result);
                        break;

                    case 'CLEAN_UI':
                        document.getElementById('controls').innerHTML = "";
                        document.getElementById('feedback-area').innerHTML = "";
                        break;

                    case 'END_GAME':
                        showEnd(data);
                        break;
                }
            });
        }

        function startUI(data) {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-zone').style.display = 'block';
            document.getElementById('p-metier').innerText = "POSTE : " + myMetier;
            document.getElementById('p-role').innerText = "STATUS : " + myRole;
            
            // Si c'est le Docteur, on ajoute un bouton permanent pour son pouvoir
            if (myMetier === 'Docteur') {
                showDoctorPower(data.all);
            }
        }

        function showDesignation(eligible) {
            const container = document.getElementById('controls');
            container.innerHTML = "<h3>CHOISISSEZ UNE SENTINELLE :</h3>";
            eligible.forEach(name => {
                let btn = document.createElement('button');
                btn.innerText = name;
                btn.onclick = () => {
                    conn.send({ type: 'SENTINELLE_CHOISIE', gardienName: myName, sentinelleName: name });
                    container.innerHTML = "<p>Désignation transmise...</p>";
                };
                container.appendChild(btn);
            });
        }

        function showVote(g, s) {
            const container = document.getElementById('controls');
            container.innerHTML = `<h3>CONSEIL : ${g} & ${s}</h3>`;
            ['OUI', 'NON'].forEach(choice => {
                let btn = document.createElement('button');
                btn.innerText = choice;
                btn.className = choice === 'OUI' ? 'btn-oui' : 'btn-non';
                btn.onclick = () => {
                    conn.send({ type: 'VOTE_DONE', playerName: myName, choice: choice });
                    container.innerHTML = "<p>Vote enregistré.</p>";
                };
                container.appendChild(btn);
            });
        }

        function showLegislative(cards, count) {
            const container = document.getElementById('controls');
            container.innerHTML = `<h3>DÉFAUSSEZ 1 DÉCRET (${count === 3 ? 'GARDIEN' : 'SENTINELLE'})</h3>`;
            cards.forEach((card, index) => {
                let btn = document.createElement('button');
                btn.innerText = card === 'S' ? 'SURVIE' : (card === 'C' ? 'CRISE' : 'SUFFRAGE');
                btn.onclick = () => {
                    let remaining = [...cards];
                    remaining.splice(index, 1);
                    if (count === 3) {
                        conn.send({ type: 'DISCARD_DONE', remaining: remaining });
                    } else {
                        conn.send({ type: 'FINAL_CHOICE', card: remaining[0] });
                    }
                    container.innerHTML = "<p>Décision transmise...</p>";
                };
                container.appendChild(btn);
            });
        }

        function showDoctorPower(allPlayers) {
            const feedback = document.getElementById('feedback-area');
            if (isPowerUsed) return;

            const btn = document.createElement('button');
            btn.id = "doc-btn";
            btn.innerText = "💉 ANALYSE SANGUINE (1x)";
            btn.onclick = () => {
                feedback.innerHTML = "<h4>CIBLE DU SCAN :</h4>";
                allPlayers.filter(n => n !== myName).forEach(target => {
                    let pBtn = document.createElement('button');
                    pBtn.innerText = target;
                    pBtn.onclick = () => {
                        conn.send({ type: 'REQUEST_BLOOD_TEST', targetName: target });
                        isPowerUsed = true;
                        btn.remove();
                        feedback.innerHTML = "<p>Analyse en cours...</p>";
                    };
                    feedback.appendChild(pBtn);
                });
            };
            document.getElementById('action-area').appendChild(btn);
        }

        function showScanResult(target, result) {
            const feedback = document.getElementById('feedback-area');
            feedback.innerHTML = `<div class="result-box ${result}">RÉSULTAT ${target} : ${result}</div>`;
        }

        function showEnd(data) {
            document.getElementById('game-zone').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            document.getElementById('end-result').innerText = data.personalResult;
            document.getElementById('end-reason').innerText = data.reason;
        }
    </script>
</body>
</html>
