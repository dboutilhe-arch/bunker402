<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Joueur</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #2ecc71; font-family: monospace; padding: 10px; text-align: center; margin: 0; overflow-x: hidden; }
        .header-ui { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px; font-size: 0.8em; }
        .mini-board { display: flex; justify-content: space-around; background: #111; padding: 8px; border-radius: 5px; margin-bottom: 10px; font-size: 0.7em; }
        .dot { width: 10px; height: 15px; border: 1px solid #444; margin: 1px; display: inline-block; border-radius: 2px; }
        .f-s { background: #3498db; border-color: #3498db; }
        .f-c { background: #e74c3c; border-color: #e74c3c; }
        #oxy-mini { height: 5px; background: #3498db; width: 100%; transition: 0.5s; margin-top: 5px; }
        .role-ui { border: 2px solid yellow; color: yellow; padding: 10px; margin-bottom: 10px; border-radius: 8px; font-weight: bold; }
        .btn { background: #111; border: 1px solid #2ecc71; color: #2ecc71; padding: 15px; width: 100%; margin: 8px 0; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-oui { background: #2ecc71 !important; color: #000 !important; border: none; }
        .btn-non { background: #e74c3c !important; color: #fff !important; border: none; }
        .card { display: block; padding: 20px; margin: 10px auto; width: 90%; border-radius: 10px; font-weight: bold; color: white; border: none; font-size: 1.1em; cursor: pointer; }
        .S { background: #3498db; } .C { background: #e74c3c; } .F { background: #7f8c8d; }
        .hidden { display: none; }
        input { background: #111; color: #2ecc71; border: 1px solid #2ecc71; padding: 15px; width: 85%; text-align: center; margin-bottom: 10px; }
        #death-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #900; color: white; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
    </style>
</head>
<body>
    <div id="death-screen"><h1>VOUS ÊTES MORT</h1><p>Le bunker continue sans vous...</p></div>
    <div id="setup">
        <h2>TERMINAL</h2>
        <input type="text" id="p-name" placeholder="NOM">
        <input type="text" id="r-code" placeholder="CODE CONSOLE">
        <button class="btn" onclick="connect()" style="background:#2ecc71; color:#000;">LIER</button>
    </div>
    <div id="game" class="hidden">
        <div class="header-ui"><span id="display-name" style="color:#f1c40f">NOM</span><span id="oxy-text-mini">OXY: 3/3</span></div>
        <div id="oxy-mini"></div>
        <div class="mini-board">
            <div>SURVIE: <div id="m-s"></div></div>
            <div>CRISE: <div id="m-c"></div></div>
        </div>
        <div class="role-ui"><div id="role-display">RÔLE : ???</div></div>
        <div id="main-ui">Synchronisation...</div>
    </div>
    <script>
        const peer = new Peer({ config: {'iceServers': [{ url: 'stun:stun.l.google.com:19302' }]} });
        let conn, myName, currentHand = [], allPlayers = [];
        function connect() {
            myName = document.getElementById('p-name').value;
            conn = peer.connect(document.getElementById('r-code').value);
            conn.on('open', () => {
                conn.send({ type: 'JOIN', name: myName });
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('game').classList.remove('hidden');
                document.getElementById('display-name').innerText = myName.toUpperCase();
            });
            conn.on('data', handleData);
        }
        function handleData(data) {
            const ui = document.getElementById('main-ui');
            if (data.type === 'INIT') {
                const r = data.role === 'S' ? 'SURVIVANT' : (data.role === 'I' ? 'INFECTÉ' : 'ALPHA');
                document.getElementById('role-display').innerText = "RÔLE : " + r;
                allPlayers = data.all; ui.innerHTML = "Prêt.";
            }
            if (data.type === 'SYNC_STATE') updateMiniBoard(data.state);
            if (data.type === 'YOUR_TURN') {
                ui.innerHTML = "<h3>TOUR DU GARDIEN</h3><p>Désignez votre Sentinelle :</p>";
                allPlayers.forEach(p => { if(p !== myName) ui.innerHTML += `<button class="btn" onclick="sendS('${p}')">${p}</button>`; });
            }
            if (data.type === 'VOTE_START') {
                ui.innerHTML = `<h3>VOTE CONSEIL</h3><p>${data.g} & ${data.s}</p>`;
                ui.innerHTML += `<button class="btn btn-oui" onclick="sendV('OUI')">VOTER OUI</button>`;
                ui.innerHTML += `<button class="btn btn-non" onclick="sendV('NON')">VOTER NON</button>`;
            }
            if (data.type === 'GARDIEN_PICK') {
                currentHand = data.cards; ui.innerHTML = "<h3>LÉGISLATION : GARDIEN</h3>";
                currentHand.forEach((c, i) => ui.innerHTML += `<button class="card ${c}" onclick="gDiscard(${i})">${c === 'S' ? 'SURVIE' : 'CRISE'}</button>`);
            }
            if (data.type === 'SENTINELLE_PICK') {
                currentHand = data.cards; ui.innerHTML = "<h3>LÉGISLATION : SENTINELLE</h3>";
                currentHand.forEach((c, i) => ui.innerHTML += `<button class="card ${c}" onclick="sChoice(${i})">${c === 'S' ? 'SURVIE' : 'CRISE'}</button>`);
            }
            if (data.type === 'REQ_POWER') {
                ui.innerHTML = `<h3>POUVOIR : ${data.power === 'TEST' ? 'TEST' : 'EXEC'}</h3>`;
                data.players.forEach(p => ui.innerHTML += `<button class="btn" style="border-color:red" onclick="usePower('${data.power}', '${p}')">${p}</button>`);
            }
            if (data.type === 'TEST_RESULT') {
                ui.innerHTML = `<div style="background:#fff; color:#000; padding:20px; border-radius:10px;"><h3>RÉSULTAT</h3><p>${data.name} est :</p><h2 style="color:${data.result === 'SAIN' ? 'blue' : 'red'}">${data.result}</h2><button class="btn" onclick="this.parentElement.remove()">OK</button></div>`;
            }
            if (data.type === 'ELIMINATED') document.getElementById('death-screen').style.display = "flex";
            if (data.type === 'CLEAN_UI') ui.innerHTML = "Attente...";
            if (data.type === 'END_GAME') ui.innerHTML = `<h1>FIN</h1><p>${data.team} GAGNENT</p><p>${data.reason}</p>`;
        }
        function updateMiniBoard(state) {
            document.getElementById('oxy-mini').style.width = (state.oxy / 3 * 100) + "%";
            document.getElementById('oxy-text-mini').innerText = `OXY: ${state.oxy}/3`;
            let s = ""; for(let i=0; i<5; i++) s += `<div class="dot ${i < state.survie ? 'f-s' : ''}"></div>`;
            document.getElementById('m-s').innerHTML = s;
            let c = ""; for(let i=0; i<6; i++) c += `<div class="dot ${i < state.crisis ? 'f-c' : ''}"></div>`;
            document.getElementById('m-c').innerHTML = c;
        }
        function sendS(s) { conn.send({ type: 'SENTINELLE_CHOISIE', gardienName: myName, sentinelleName: s }); }
        function sendV(v) { ui.innerHTML = "Voté."; conn.send({ type: 'VOTE_DONE', choice: v }); }
        function gDiscard(idx) { let cs = [...currentHand]; cs.splice(idx, 1); conn.send({ type: 'DISCARD_DONE', remaining: cs }); }
        function sChoice(idx) { conn.send({ type: 'FINAL_CHOICE', card: currentHand[idx] }); }
        function usePower(p, t) { conn.send({ type: p === 'TEST' ? 'DO_TEST' : 'DO_EXEC', target: t }); }
    </script>
</body>
</html>
