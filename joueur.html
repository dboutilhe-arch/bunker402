<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunker 402 - Terminal</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #2ecc71; font-family: monospace; padding: 15px; text-align: center; }
        .btn { background: #111; border: 1px solid #2ecc71; color: #2ecc71; padding: 15px; width: 100%; margin: 10px 0; border-radius: 8px; font-weight: bold; font-size: 1.1em; }
        .card { display: block; padding: 25px; margin: 10px auto; width: 90%; border-radius: 10px; font-weight: bold; color: white; border: none; font-size: 1.2em; }
        .S { background: #3498db; } .C { background: #e74c3c; } .F { background: #7f8c8d; }
        .hidden { display: none; }
        input { background: #111; color: #2ecc71; border: 1px solid #2ecc71; padding: 15px; width: 80%; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="setup">
        <h2>IDENTIFICATION</h2>
        <input type="text" id="p-name" placeholder="VOTRE NOM">
        <input type="text" id="r-code" placeholder="CODE CONSOLE">
        <button class="btn" onclick="connect()">SE CONNECTER</button>
    </div>

    <div id="game" class="hidden">
        <div id="role-box" style="border:1px solid yellow; color:yellow; padding:10px; margin-bottom:15px;">RÔLE : ???</div>
        <div id="main-ui">Initialisation du système...</div>
    </div>

    <script>
        const peer = new Peer();
        let conn, myName, allPlayers = [];

        // 1. CONNEXION
        function connect() {
            myName = document.getElementById('p-name').value;
            const code = document.getElementById('r-code').value;
            conn = peer.connect(code);
            conn.on('open', () => {
                conn.send({ type: 'JOIN', name: myName });
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('game').classList.remove('hidden');
            });
            conn.on('data', handleData);
        }

        // 2. RÉCEPTION DES ORDRES DU PC
        function handleData(data) {
            const ui = document.getElementById('main-ui');

            // Initialisation de la partie
            if (data.type === 'GAME_START') {
                allPlayers = data.all;
                const r = data.role === 'S' ? 'SURVIVANT' : (data.role === 'I' ? 'INFECTÉ' : 'ALPHA');
                document.getElementById('role-box').innerText = "RÔLE : " + r;
                ui.innerHTML = "Partie lancée. En attente...";
            }

            // C'est au Gardien de choisir la Sentinelle
            if (data.type === 'YOUR_TURN_G') {
                ui.innerHTML = "<h3>VOUS ÊTES GARDIEN</h3><p>Désignez votre Sentinelle :</p>";
                allPlayers.forEach(p => {
                    if(p !== myName) {
                        ui.innerHTML += `<button class="btn" onclick="choseS('${p}')">${p}</button>`;
                    }
                });
            }

            // Demande de vote
            if (data.type === 'VOTE_REQ') {
                ui.innerHTML = `<h3>VOTE CONSEIL</h3><p>${data.g} & ${data.s}</p>`;
                ui.innerHTML += `<button class="btn" style="background:#2ecc71; color:black" onclick="vote('OUI')">OUI</button>`;
                ui.innerHTML += `<button class="btn" style="background:#e74c3c; color:white" onclick="vote('NON')">NON</button>`;
            }

            // Le Gardien doit défausser 1 carte sur 3
            if (data.type === 'G_PICK_3') {
                ui.innerHTML = "<h3>GARDIEN : ÉCARTER</h3><p>Choisissez 1 carte à défausser :</p>";
                data.cards.forEach((c, i) => {
                    ui.innerHTML += `<button class="card ${c}" onclick="gDiscard(${i}, ${JSON.stringify(data.cards)})">${c==='S'?'SURVIE':'CRISE'}</button>`;
                });
            }

            // La Sentinelle doit choisir 1 carte sur 2
            if (data.type === 'S_DECIDE') {
                ui.innerHTML = "<h3>SENTINELLE : APPLIQUER</h3><p>Choisissez le décret final :</p>";
                data.cards.forEach(c => {
                    ui.innerHTML += `<button class="card ${c}" onclick="sFinal('${c}')">${c==='S'?'SURVIE':'CRISE'}</button>`;
                });
            }

            // Nettoyage de l'interface
            if (data.type === 'SYNC') { ui.innerHTML = "Synchronisation... En attente."; }
        }

        // 3. FONCTIONS D'ENVOI (ACTIONS JOUEUR)
        function choseS(name) {
            conn.send({ type: 'CHOSE_S', gName: myName, sName: name });
        }

        function vote(choice) {
            document.getElementById('main-ui').innerHTML = "Vote transmis.";
            conn.send({ type: 'VOTE_SUBMIT', choice: choice });
        }

        function gDiscard(idx, cards) {
            cards.splice(idx, 1); // On retire la carte choisie
            document.getElementById('main-ui').innerHTML = "Cartes transmises à la Sentinelle.";
            conn.send({ type: 'G_DISCARD', remaining: cards });
        }

        function sFinal(card) {
            document.getElementById('main-ui').innerHTML = "Décret promulgué.";
            conn.send({ type: 'S_FINAL', card: card });
        }
    </script>
</body>
</html>
