<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Joueur</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #2ecc71; font-family: monospace; padding: 10px; text-align: center; margin: 0; overflow-x: hidden; }
        .mini-board { display: flex; justify-content: space-around; background: #111; padding: 8px; border-radius: 5px; margin-bottom: 10px; }
        .dot { width: 12px; height: 18px; border: 1px solid #444; margin: 2px; display: inline-block; border-radius: 2px; }
        .f-s { background: #3498db; } .f-c { background: #e74c3c; }
        .btn { background: #111; border: 1px solid #2ecc71; color: #2ecc71; padding: 18px; width: 100%; margin: 8px 0; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1em; }
        .btn-oui { background: #2ecc71 !important; color: #000 !important; }
        .btn-non { background: #e74c3c !important; color: #fff !important; border: none; }
        .card { display: block; padding: 25px; margin: 10px auto; width: 95%; border-radius: 10px; font-weight: bold; color: white; border: none; font-size: 1.2em; cursor: pointer; }
        .S { background: #3498db; } .C { background: #e74c3c; } .F { background: #7f8c8d; }
        .hidden { display: none; }
        #death-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #900; color: white; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        input { background: #111; color: #2ecc71; border: 1px solid #2ecc71; padding: 15px; width: 85%; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>
    <div id="death-screen"><h1>ÉLIMINÉ</h1></div>
    <div id="setup">
        <h2>BUNKER 402</h2>
        <input type="text" id="p-name" placeholder="NOM">
        <input type="text" id="r-code" placeholder="CODE CONSOLE">
        <button class="btn" onclick="connect()">LIER</button>
    </div>
    <div id="game" class="hidden">
        <div id="my-name" style="color:#f1c40f; margin-bottom:10px; font-weight:bold;"></div>
        <div class="mini-board">
            <div>S <div id="m-s"></div></div>
            <div>C <div id="m-c"></div></div>
        </div>
        <div id="role-ui" style="border:1px solid yellow; padding:10px; color:yellow; margin-bottom:10px;"></div>
        <div id="main-ui">En attente...</div>
    </div>
    <script>
        const peer = new Peer({ config: {'iceServers': [{ url: 'stun:stun.l.google.com:19302' }]} });
        let conn, myName, currentHand = [], allPlayers = [];

        function connect() {
            myName = document.getElementById('p-name').value;
            const code = document.getElementById('r-code').value;
            if(!myName || !code) return;
            conn = peer.connect(code);
            conn.on('open', () => {
                conn.send({ type: 'JOIN', name: myName });
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('game').classList.remove('hidden');
                document.getElementById('my-name').innerText = myName.toUpperCase();
            });
            conn.on('data', handleData);
        }

        function handleData(data) {
            const ui = document.getElementById('main-ui');
            if (data.type === 'INIT') {
                allPlayers = data.all;
                document.getElementById('role-ui').innerText = "RÔLE : " + (data.role === 'S' ? 'SURVIVANT' : (data.role === 'I' ? 'INFECTÉ' : 'ALPHA'));
            }
            if (data.type === 'SYNC') {
                let s = ""; for(let i=0; i<5; i++) s += `<div class="dot ${i < data.state.survie ? 'f-s' : ''}"></div>`;
                document.getElementById('m-s').innerHTML = s;
                let c = ""; for(let i=0; i<6; i++) c += `<div class="dot ${i < data.state.crisis ? 'f-c' : ''}"></div>`;
                document.getElementById('m-c').innerHTML = c;
            }
            if (data.type === 'G_TURN') {
                ui.innerHTML = "<h3>CHOIX SENTINELLE</h3>";
                allPlayers.forEach(p => { if(p !== myName) ui.innerHTML += `<button class="btn" onclick="sendS('${p}')">${p}</button>`; });
            }
            if (data.type === 'V_START') {
                ui.innerHTML = `<h3>VOTE CONSEIL</h3><p>${data.g} & ${data.s}</p>`;
                ui.innerHTML += `<button class="btn btn-oui" onclick="sendV('OUI')">OUI</button>`;
                ui.innerHTML += `<button class="btn btn-non" onclick="sendV('NON')">NON</button>`;
            }
            if (data.type === 'G_PICK') {
                currentHand = data.cards; ui.innerHTML = "<h3>GARDIEN : ÉCARTEZ</h3>";
                currentHand.forEach((c, i) => {
                    let label = (c === 'S') ? 'SURVIE' : (c === 'C' ? 'CRISE' : 'SUFFRAGE');
                    ui.innerHTML += `<button class="card ${c}" onclick="gDiscard(${i})">${label}</button>`;
                });
            }
            if (data.type === 'S_PICK') {
                currentHand = data.cards; ui.innerHTML = "<h3>SENTINELLE : CHOISISSEZ</h3>";
                currentHand.forEach((c, i) => {
                    let label = (c === 'S') ? 'SURVIE' : (c === 'C' ? 'CRISE' : 'SUFFRAGE');
                    ui.innerHTML += `<button class="card ${c}" onclick="sChoice(${i})">${label}</button>`;
                });
            }
            if (data.type === 'REQ_P') {
                ui.innerHTML = `<h3>POUVOIR : ${data.power}</h3>`;
                data.targets.forEach(p => ui.innerHTML += `<button class="btn" style="border-color:red" onclick="usePower('${data.power}', '${p}')">${p}</button>`);
            }
            if (data.type === 'T_RES') {
                ui.innerHTML = `<div style="background:#fff; color:#000; padding:20px; border-radius:10px;"><h3>TEST</h3><p>${data.name} est ${data.result}</p><button class="btn" onclick="this.parentElement.remove()">OK</button></div>`;
            }
            if (data.type === 'DEAD') document.getElementById('death-screen').style.display = "flex";
            if (data.type === 'CLEAN') ui.innerHTML = "Attente...";
            if (data.type === 'END') ui.innerHTML = `<h2>FIN : ${data.team}</h2><p>${data.reason}</p>`;
        }

        function sendS(s) { conn.send({ type: 'SENT_CHOICE', gName: myName, sName: s }); }
        function sendV(v) { document.getElementById('main-ui').innerHTML = "Voté."; conn.send({ type: 'VOTE_DONE', choice: v }); }
        function gDiscard(idx) { 
            let cs = [...currentHand]; 
            cs.splice(idx, 1); 
            document.getElementById('main-ui').innerHTML = "Transmis.";
            conn.send({ type: 'DISCARD_DONE', remaining: cs }); 
        }
        function sChoice(idx) { 
            let card = currentHand[idx];
            document.getElementById('main-ui').innerHTML = "Promulgué."; 
            conn.send({ type: 'FINAL_CHOICE', card: card }); 
        }
        function usePower(p, t) { conn.send({ type: p === 'TEST' ? 'DO_TEST' : 'DO_EXEC', target: t }); }
    </script>
</body>
</html>
